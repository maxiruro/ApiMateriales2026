<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css"
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

    <title>App!</title>
</head>

<body>

    <div class="container mt-4">
        <h2>Consulta de productos por rubro y material</h2>

        <div class="mb-3">
            <label for="selectRubro" class="form-label">Rubro</label>
            <select id="selectRubro" class="form-select">
                <option value="0">Seleccione un rubro</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="selectMaterial" class="form-label">Material</label>
            <select id="selectMaterial" class="form-select" disabled>
                <option value="0">Seleccione un material</option>
            </select>
        </div>

        <div class="mb-3">
            <label for="selectProducto" class="form-label">Producto</label>
            <select id="selectProducto" class="form-select" disabled>
                <option value="0">Seleccione un producto</option>
            </select>
        </div>

        <div id="mensaje"></div>
    </div>

    <script src="../../js/select.js"></script>

</body>

</html>
