<div class="container mt-3">
    <section>
        <article>

            <h2 class="titulo-vista">Listado de Materiales por Producto</h2>

            <table class="table table-bordered table-sm" id="tablaProductos" width="100%" cellspacing="0">
                <thead>
                    <tr>
                        <th>Producto</th>
                        <th class="text-end">Costo Total</th>
                        <th class="text-center">% de Ganancia</th>
                        <th class="text-end">Precio de venta</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

            <!-- Button trigger modal -->
            <button type="button" class="btn-nuevo-flotante" onclick="imprimir()">
                Imprimir Informe
            </button>


        </article>
    </section>
</div>

<script src="../../js/informeMaterialesPorProducto.js"></script>

<script>
    function imprimir() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');

        // ============================
        // FECHA Y HORA DE IMPRESIÓN
        // ============================
        const ahora = new Date();
        const dia = String(ahora.getDate()).padStart(2, '0');
        const mes = String(ahora.getMonth() + 1).padStart(2, '0');
        const anio = ahora.getFullYear();
        const horas = String(ahora.getHours()).padStart(2, '0');
        const minutos = String(ahora.getMinutes()).padStart(2, '0');

        const fechaHoraFormateada = `${dia}/${mes}/${anio} ${horas}:${minutos}`;

        // ============================
        // ENCABEZADO
        // ============================
        pdf.setFontSize(16);
        pdf.setFont("helvetica", "bold");

        pdf.text(
            'INFORME DE MATERIALES POR PRODUCTO',
            105,
            20,
            { align: 'center' }
        );

        pdf.setFont("helvetica", "normal");
        pdf.setFontSize(10);

        pdf.text(
            'Detalle de productos y sus materiales',
            105,
            27,
            { align: 'center' }
        );

        pdf.setFontSize(9);

        pdf.text(
            'Sistema: API Materiales',
            14,
            38
        );

        pdf.text(
            `Fecha de Impresión: ${fechaHoraFormateada}`,
            196,
            38,
            { align: 'right' }
        );

        // Línea separadora
        pdf.setLineWidth(0.5);
        pdf.line(14, 42, 196, 42);

        // ============================
        // TABLA
        // ============================
        pdf.autoTable({
            html: '#tablaProductos',
            startY: 48,
            margin: { left: 14, right: 14 }, // Alineación exacta con la línea del encabezado
            theme: 'grid',
            useCss: true,

            styles: {
                font: 'helvetica',
                fontSize: 8,
                cellPadding: 3,
                lineWidth: 0.1,
                valign: 'middle'
            },

            headStyles: {
                fillColor: [43, 27, 61],
                textColor: [255, 255, 255],
                fontStyle: 'bold',
                valign: 'middle'
            },

            // Alineación fluida sin fijar cellWidth para evitar el desfasaje del borde
            columnStyles: {
                0: { halign: 'left' },   // Producto / Material
                1: { halign: 'right' },  // Costo Total / Costo Unit.
                2: { halign: 'center' }, // % Ganancia / Cantidad
                3: { halign: 'right' }   // Precio Venta / Subtotal
            },

            // Sanitización para limpiar caracteres raros antes de dibujar la celda
            didParseCell: function (data) {
                if (data.cell.raw) {
                    // Remplaza el símbolo ↳ o caracteres fuera de ISO-8859-1 si sobrevivieron
                    let textoLimpio = data.cell.text[0].replace(/↳/g, '-').replace(/[^\x00-\xFF]/g, '');
                    data.cell.text[0] = textoLimpio;
                }

                if (data.section === 'head') {
                    if (data.column.index === 0) data.cell.styles.halign = 'left';
                    if (data.column.index === 1) data.cell.styles.halign = 'right';
                    if (data.column.index === 2) data.cell.styles.halign = 'center';
                    if (data.column.index === 3) data.cell.styles.halign = 'right';
                }
            },

            tableLineColor: [200, 200, 200],
            tableLineWidth: 0.1,
            showHead: 'everyPage',
            rowPageBreak: 'avoid'
        });

        // ============================
        // PIE DE PÁGINA
        // ============================
        const paginas = pdf.internal.getNumberOfPages();

        for (let i = 1; i <= paginas; i++) {
            pdf.setPage(i);
            pdf.setFont("helvetica", "normal");
            pdf.setFontSize(8);
            pdf.setTextColor(100, 100, 100);

            pdf.text(
                'API Materiales - Maximiliano Rojas - Programación 2026',
                14,
                290
            );

            pdf.text(
                'Página ' + i + ' de ' + paginas,
                196,
                290,
                { align: 'right' }
            );
        }

        // ============================
        // GUARDAR PDF
        // ============================
        pdf.save(`Informe_Materiales_${anio}${mes}${dia}.pdf`);
    }

</script>
